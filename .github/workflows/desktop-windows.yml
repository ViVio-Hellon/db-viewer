# デスクトップ版(Windows)を作って確かめる(python-web-tools と同じ作り)
#
# 作るもの: DBViewer.exe(成果物 "DBViewer-windows" から取れる)。
# 配るときは、ツールのフォルダの直下(Start.vbs と同じ場所)に置いてから scripts\make_dist.bat を流す
# (make_dist が「DBビューア.exe」の名前で配布フォルダに入れる)。
#
# 確かめること:
#   - Python の試験(Windows の上で。標準入出力のやりとり・ファイルの錠は OS で違いが出やすい)
#   - Rust の試験
#   - 作った exe を本当に起動し、画面が Python から届くこと・ポートで待ち受けないこと・
#     2つ目は起動しないこと・ブラウザ版は理由を出して止まること・止めたら Python も終わること
#     (scripts/desktop_smoke.py)
name: デスクトップ版(Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python の部品を入れる
        run: python -m pip install -r requirements.txt

      - name: Python の試験
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -t .

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust の試験
        working-directory: src-tauri
        run: cargo test --release

      - name: exe を作る
        working-directory: src-tauri
        run: cargo build --release

      - name: 作った exe を起動して確かめる
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/desktop_smoke.py --exe src-tauri/target/release/DBViewer.exe

      - uses: actions/upload-artifact@v6
        with:
          name: DBViewer-windows
          path: src-tauri/target/release/DBViewer.exe
          if-no-files-found: error
