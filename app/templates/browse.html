{% extends "base.html" %}
{% block title %}閲覧・出力 — {{ display_name }}{% endblock %}
{% block head %}
<style>
  .br { display:grid; grid-template-columns:13em minmax(0,1fr); gap:14px; flex:1; min-height:0; }
  @media (max-width:900px){ .br { grid-template-columns:1fr; } }
  .br__list { border:1px solid var(--rule); border-radius:var(--radius-xs); background:var(--surface); overflow:auto; align-self:start; max-height:100%; }
  .br__list button { all:unset; box-sizing:border-box; display:block; width:100%; padding:6px 10px; cursor:pointer;
                     font-size:var(--fs-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); }
  .br__list button:hover { background:var(--accent-soft); }
  .br__list button[aria-current="true"] { background:var(--accent); color:var(--on-accent); }
  .br__list button:focus-visible { box-shadow:inset 0 0 0 2px var(--focus); }
  .br__main { display:flex; flex-direction:column; gap:8px; min-width:0; min-height:0; }
  .br__head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .br__head h3 { margin:0; font-size:var(--fs-lg, 15px); }
  #brPrintCols { flex:1; min-width:0; }
  .br__grid { display:flex; flex:1; min-height:0; min-width:0; }
  .brv { display:flex; flex-direction:column; gap:10px; overflow:hidden; }
</style>
{% endblock %}
{% block content %}
<div class="pane brv">
  <div class="pane__head">
    <div><span class="eyebrow">Step 3</span><h2>閲覧・出力</h2></div>
    <p class="why" id="brNote" style="margin:0">全般設定「テーブル閲覧」の表を、一覧と同じ表(並べ替え・絞り込み・列の設定)で見て、コピー・保存・印刷します。</p>
  </div>
  <p class="status status--ng" id="brProblem" hidden></p>
  <div class="br">
    <nav class="br__list" id="brTables" aria-label="表"></nav>
    <div class="br__main">
      <div class="br__head">
        <h3 id="brName">表を選んでください</h3>
        <span class="why" id="brPrintCols" style="margin:0" title="設定 → かんたん設定 の「印刷」"></span>
        <button class="btn btn--commit" type="button" id="brAddCol" hidden title="この表のいちばん右に列を足します(編集可)">＋ 列を追加</button>
        <button class="btn btn--find" type="button" id="brPrint" disabled>印刷</button>
        <div class="menu">
          <button class="btn btn--find" type="button" id="brOut" aria-haspopup="true" aria-expanded="false" disabled>出力 ▾</button>
          <div class="menu__list" id="brMenu" hidden>
            <button type="button" id="brCopy">表をコピー<small>見えている行・列を、Excel やメールに貼り付けられる形で</small></button>
            <button type="button" id="brSave">ファイルに保存…<small>CSV など。設定の「出力先」フォルダに書きます</small></button>
          </div>
        </div>
      </div>
      <div class="br__grid" id="brGrid"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script type="module">
  import { start } from "{{ url_for('static', filename='js/views/browse.js') }}";
  start();
</script>
{% endblock %}
