{% extends "base.html" %}
{% block title %}一覧 — {{ display_name }}{% endblock %}

{% block head %}
<style>
  /* 一覧は画面の高さいっぱいに表を出す(表の中だけがスクロールする) */
  .lview { display:flex; flex-direction:column; gap:8px; overflow:hidden; }
  .lv__head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .lv__title { display:flex; align-items:baseline; gap:10px; min-width:0; }
  .lv__title h2 { font-size:var(--fs-xl); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lv__act { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .lv__sep { width:1px; align-self:stretch; background:var(--rule); margin:0 4px; }
  .lv__body { display:grid; grid-template-columns:minmax(0,1fr) 21rem; gap:12px; flex:1; min-height:0; }
  .lv__body.no-detail { grid-template-columns:minmax(0,1fr); }
  .lv__body.no-detail .lv__detail { display:none; }
  .lv__grid { display:flex; min-height:0; min-width:0; }
  @media (max-width:1100px) { .lv__body { grid-template-columns:minmax(0,1fr); }
                              .lv__detail { max-height:40vh; } }
  /* 選んだ行の詳細(すべての列。隠した列も) */
  .lv__detail { border:1px solid var(--rule); border-radius:var(--radius-xs); background:var(--surface);
                overflow:auto; min-height:0; display:flex; flex-direction:column; }
  .dt__head { position:sticky; top:0; background:var(--raised); padding:8px 12px; border-bottom:1px solid var(--rule);
              display:flex; flex-direction:column; gap:2px; }
  .dt__head small { color:var(--muted); font-size:var(--fs-xs); }
  .dt__head b { font-size:var(--fs-md); overflow-wrap:anywhere; }
  .dt__list { margin:0; padding:6px 12px 12px; display:grid; grid-template-columns:minmax(6em, 40%) 1fr; gap:4px 10px; font-size:var(--fs-sm); }
  .dt__list dt { color:var(--muted); overflow-wrap:anywhere; }
  .dt__list dd { margin:0; color:var(--ink); overflow-wrap:anywhere; white-space:pre-wrap; }
  .dt__list .is-hidden { opacity:.65; }
  .dt__list .dt__sep { grid-column:1 / -1; border-top:1px dashed var(--rule); margin:6px 0 2px; color:var(--faint); font-size:var(--fs-xs); padding-top:4px; }
  .dt__empty { padding:16px 12px; color:var(--muted); font-size:var(--fs-sm); }
</style>
{% endblock %}

{% block content %}
<div class="pane lview">
  <div class="lv__head">
    <div class="lv__title">
      <h2 id="listTitle">一覧</h2>
      <span class="why" style="margin:0">見出しを押すと並べ替え、▾ で絞り込み、行をダブルクリックで修正</span>
    </div>
    <div class="lv__act">
      <button class="btn btn--commit" type="button" id="actNew"><span class="gl">＋</span>新規</button>
      <button class="btn btn--find" type="button" id="actEdit" disabled>修正</button>
      <button class="btn btn--find" type="button" id="actView" disabled>参照</button>
      <button class="btn btn--danger" type="button" id="actDelete" disabled>削除</button>
      <span class="lv__sep" aria-hidden="true"></span>
      <button class="btn btn--find" type="button" id="actReport" hidden title="全般設定「帳票」の帳票を、いま絞り込んでいる行で作ります(並びは帳票の決まりどおり)">帳票</button>
      <button class="btn btn--find" type="button" id="actPrint" title="いま見えている表をそのまま印刷(A4 横)">印刷</button>
      <div class="menu">
        <button class="btn btn--find" type="button" id="actOut" aria-haspopup="true" aria-expanded="false">出力 ▾</button>
        <div class="menu__list" id="outMenu" hidden>
          <button type="button" id="outCopy">表をコピー<small>見えている行・列を、Excel やメールに貼り付けられる形で</small></button>
          <button type="button" id="outSave">ファイルに保存…<small>CSV など。設定の「出力先」フォルダに書きます</small></button>
        </div>
      </div>
      <button class="btn btn--find" type="button" id="actDetail" aria-pressed="true" title="選んだ行の中身を右に出す">詳細</button>
    </div>
  </div>

  <p class="status status--ng" id="listProblem" hidden></p>
  <p class="status status--warn" id="listUpdated" hidden>
    他の端末で更新されました。表示している一覧は古い可能性があります。
    <button class="btn btn--find" type="button" id="listReload" style="margin-left:8px">再読込</button>
  </p>

  <div class="lv__body" id="lvBody">
    <div class="lv__grid" id="grid"></div>
    <aside class="lv__detail" id="detail" aria-label="選んだ行の詳細">
      <p class="dt__empty">行を選ぶと、ここに全部の列が出ます。</p>
    </aside>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
  import { start } from "{{ url_for('static', filename='js/views/list.js') }}";
  start();
</script>
{% endblock %}
